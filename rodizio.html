<script>
    var n = parseInt(prompt("Digite o último número da placa:"));
    switch(n) {
        case 1:
        case 2:
            alert("Segunda-feira");
            break; 
        
        case 3:
        case 4:
            alert("Terça-feira");
            break;
            
        case 5:
        case 6:
            alert("Quarta-feira");
            break;
            
        case 7:
        case 8:
            alert("Quinta-feira");
            break;
            
        case 9:
        case 0:
            alert("Sexta-feira");
            break;
    }
</script>
